# Publishes to pub.dev when a version tag (v1.2.3) is pushed, through pub.dev's automated publishing with GitHub's
# OIDC token: no stored secret. pub.dev must allow this repository and the tag pattern v{{version}} (package Admin tab).
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
